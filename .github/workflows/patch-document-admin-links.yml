name: Patch document management admin links

on:
  push:
    paths:
      - '.github/workflows/patch-document-admin-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add advanced administration links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('document-management-system-v2/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<section id="admin" class="view"><div class="admin-grid">'
          new = '''<section id="admin" class="view"><div class="card" style="margin-bottom:18px"><div class="card-h"><h2>관리 도구</h2><span class="muted">시스템관리자·문서관리자용</span></div><div class="card-b"><div class="toolbar"><a class="btn" href="./user-admin.html">직원·권한 관리</a><a class="btn" href="./drive-setup.html">Google Drive 설정</a></div><p class="muted" style="margin:12px 0 0">직원 40명 일괄 등록, 권한 변경, 계정 중지, 비밀번호 초기화와 Google Shared Drive 연결 상태를 관리합니다.</p></div></div><div class="admin-grid">'''
          if old not in text:
              raise SystemExit('Target admin section was not found; no file changed.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patched page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add document-management-system-v2/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Link employee and Drive administration tools"
            git push
          fi
